<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Policy - IQRO Quran Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #fdfdfb; color: #1e293b; }
        .content-card { background: white; border-radius: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .lang-btn { transition: all 0.2s; }
        .lang-btn:hover { background-color: #f1f5f9; }
        .active-lang { border: 2px solid #15803d; background-color: #f0fdf4; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <!-- Header & Lang Selector -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <a href="page.html" class="text-green-700 font-bold flex items-center gap-2 mb-2">
                    <i class="fa-solid fa-arrow-left"></i> Kembali ke Beranda
                </a>
                <h1 id="page-title" class="text-3xl font-black text-slate-900">Privacy Policy</h1>
            </div>
            <div class="relative inline-block text-left w-full md:w-auto">
                <select id="langSelect" onchange="changeLanguage(this.value)" class="block w-full bg-white border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
                    <option value="id">🇮🇩 Bahasa Indonesia</option>
                    <option value="en">🇺🇸 English</option>
                    <option value="ar">🇸🇦 العربية</option>
                    <option value="ru">🇷🇺 Русский</option>
                    <option value="zh">🇨🇳 中文</option>
                    <option value="ja">🇯🇵 日本語</option>
                </select>
            </div>
        </div>

        <!-- Main Content -->
        <div class="content-card p-6 md:p-10 border border-gray-100">
            <div id="main-content" class="prose prose-slate max-w-none">
                <!-- Content will be injected here -->
            </div>
        </div>

        <footer class="mt-12 text-center text-sm text-gray-400 font-bold">
            &copy; 2026 IQRO QURAN DIGITAL by Te_eR™ Innovative
        </footer>
    </div>

    <script>
        const translations = {"id": {"title": "Kebijakan Privasi", "body": "<h3>1. Pengumpulan Data</h3><p>IQRO Quran Digital menggunakan akun Google Anda untuk personalisasi fitur (progres belajar & bookmark). Kami tidak menyimpan kata sandi Anda.</p>\n                   <h3>2. Rekaman Suara</h3><p>Fitur 'Rekam Bacaan' menggunakan mikrofon untuk analisis makhraj secara lokal atau via API Vocal Studio TTSPro. Data dikirim secara anonim dan tidak dibagikan.</p>\n                   <h3>3. Keamanan</h3><p>Kami menjaga data Muslim dan Muslimah di seluruh dunia dengan standar keamanan terbaik.</p>"}, "en": {"title": "Privacy Policy", "body": "<h3>1. Data Collection</h3><p>IQRO Quran Digital uses your Google account for feature personalization (learning progress & bookmarks). We do not store your password.</p>\n                   <h3>2. Audio Recordings</h3><p>The 'Read Record' feature uses the microphone for makhraj analysis locally or via Vocal Studio TTSPro API. Data is sent anonymously.</p>\n                   <h3>3. Security</h3><p>We protect the data of Muslims worldwide with high security standards.</p>"}, "ar": {"title": "\u0633\u064a\u0627\u0633\u0629 \u0627\u0644\u062e\u0635\u0648\u0635\u064a\u0629", "body": "<h3>\u0661. \u062c\u0645\u0639 \u0627\u0644\u0628\u064a\u0627\u0646\u0627\u062a</h3><p>\u064a\u0633\u062a\u062e\u062f\u0645 \"\u0627\u0642\u0631\u0623 \u0642\u0631\u0622\u0646 \u062f\u064a\u062c\u064a\u062a\u0627\u0644\" \u062d\u0633\u0627\u0628 \u062c\u0648\u062c\u0644 \u0627\u0644\u062e\u0627\u0635 \u0628\u0643 \u0644\u062a\u062e\u0635\u064a\u0635 \u0627\u0644\u0645\u064a\u0632\u0627\u062a (\u062a\u0642\u062f\u0645 \u0627\u0644\u062a\u0639\u0644\u0645 \u0648\u0627\u0644\u0625\u0634\u0627\u0631\u0627\u062a \u0627\u0644\u0645\u0631\u062c\u0639\u064a\u0629). \u0646\u062d\u0646 \u0644\u0627 \u0646\u062e\u0632\u0646 \u0643\u0644\u0645\u0629 \u0627\u0644\u0645\u0631\u0648\u0631 \u0627\u0644\u062e\u0627\u0635\u0629 \u0628\u0643.</p>\n                   <h3>\u0662. \u0627\u0644\u062a\u0633\u062c\u064a\u0644\u0627\u062a \u0627\u0644\u0635\u0648\u062a\u064a\u0629</h3><p>\u062a\u0633\u062a\u062e\u062f\u0645 \u0645\u064a\u0632\u0629 \"\u062a\u0633\u062c\u064a\u0644 \u0627\u0644\u0642\u0631\u0627\u0621\u0629\" \u0627\u0644\u0645\u064a\u0643\u0631\u0648\u0641\u0648\u0646 \u0644\u062a\u062d\u0644\u064a\u0644 \u0627\u0644\u0645\u062e\u0627\u0631\u062c \u0645\u062d\u0644\u064a\u064b\u0627 \u0623\u0648 \u0639\u0628\u0631 \u0648\u0627\u062c\u0647\u0629 \u0628\u0631\u0645\u062c\u0629 \u062a\u0637\u0628\u064a\u0642\u0627\u062a Vocal Studio TTSPro.</p>"}};

        function changeLanguage(lang) {
            const contentArea = document.getElementById('main-content');
            const pageTitle = document.getElementById('page-title');
            
            const data = translations[lang] || translations['id'];
            pageTitle.innerText = data.title;
            contentArea.innerHTML = data.body;
            
            document.documentElement.lang = lang;
            if(lang === 'ar') {
                contentArea.style.direction = 'rtl';
                contentArea.style.textAlign = 'right';
            } else {
                contentArea.style.direction = 'ltr';
                contentArea.style.textAlign = 'left';
            }
        }

        // Initial Load
        changeLanguage('id');
    </script>
</body>
</html>

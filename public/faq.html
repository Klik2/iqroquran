<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ - IQRO Quran Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #fdfdfb; color: #1e293b; }
        .content-card { background: white; border-radius: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .lang-btn { transition: all 0.2s; }
        .lang-btn:hover { background-color: #f1f5f9; }
        .active-lang { border: 2px solid #15803d; background-color: #f0fdf4; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <!-- Header & Lang Selector -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <a href="page.html" class="text-green-700 font-bold flex items-center gap-2 mb-2">
                    <i class="fa-solid fa-arrow-left"></i> Kembali ke Beranda
                </a>
                <h1 id="page-title" class="text-3xl font-black text-slate-900">FAQ</h1>
            </div>
            <div class="relative inline-block text-left w-full md:w-auto">
                <select id="langSelect" onchange="changeLanguage(this.value)" class="block w-full bg-white border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
                    <option value="id">🇮🇩 Bahasa Indonesia</option>
                    <option value="en">🇺🇸 English</option>
                    <option value="ar">🇸🇦 العربية</option>
                    <option value="ru">🇷🇺 Русский</option>
                    <option value="zh">🇨🇳 中文</option>
                    <option value="ja">🇯🇵 日本語</option>
                </select>
            </div>
        </div>

        <!-- Main Content -->
        <div class="content-card p-6 md:p-10 border border-gray-100">
            <div id="main-content" class="prose prose-slate max-w-none">
                <!-- Content will be injected here -->
            </div>
        </div>

        <footer class="mt-12 text-center text-sm text-gray-400 font-bold">
            &copy; 2026 IQRO QURAN DIGITAL by Te_eR™ Innovative
        </footer>
    </div>

    <script>
        const translations = {"id": {"title": "FAQ (Tanya Jawab)", "body": "<div class='mb-4'><strong>Q: Apakah aplikasi ini gratis?</strong><br>A: Ya, sepenuhnya gratis untuk umat Muslim di seluruh dunia.</div>\n                   <div class='mb-4'><strong>Q: Apa sumber database-nya?</strong><br>A: Al-Qur'an dan Murottal dari Quran Cloud. Metode Iqro 1-6 dari karya K.H. As'ad Humam.</div>\n                   <div class='mb-4'><strong>Q: Siapa yang bisa menggunakan?</strong><br>A: Semua umur dan semua profesi.</div>"}, "en": {"title": "FAQ", "body": "<div class='mb-4'><strong>Q: Is this app free?</strong><br>A: Yes, it is completely free for Muslims worldwide.</div>\n                   <div class='mb-4'><strong>Q: What are the data sources?</strong><br>A: Quran and Murottal from Quran Cloud. Iqro Method 1-6 from K.H. As'ad Humam.</div>\n                   <div class='mb-4'><strong>Q: Who can use it?</strong><br>A: All ages and all professions.</div>"}, "ar": {"title": "\u0627\u0644\u0623\u0633\u0626\u0644\u0629 \u0627\u0644\u0634\u0627\u0626\u0639\u0629", "body": "<div class='mb-4'><strong>\u0633: \u0647\u0644 \u0647\u0630\u0627 \u0627\u0644\u062a\u0637\u0628\u064a\u0642 \u0645\u062c\u0627\u0646\u064a\u061f</strong><br>\u062c: \u0646\u0639\u0645\u060c \u0647\u0648 \u0645\u062c\u0627\u0646\u064a \u062a\u0645\u0627\u0645\u064b\u0627 \u0644\u0644\u0645\u0633\u0644\u0645\u064a\u0646 \u0641\u064a \u062c\u0645\u064a\u0639 \u0623\u0646\u062d\u0627\u0621 \u0627\u0644\u0639\u0627\u0644\u0645.</div>\n                   <div class='mb-4'><strong>\u0633: \u0645\u0627 \u0647\u064a \u0645\u0635\u0627\u062f\u0631 \u0627\u0644\u0628\u064a\u0627\u0646\u0627\u062a\u061f</strong><br>\u062c: \u0627\u0644\u0642\u0631\u0622\u0646 \u0648\u0627\u0644\u0645urottal \u0645\u0646 Quran Cloud. \u0645\u0646\u0647\u062c \u0627\u0642\u0631\u0623 \u0661-\u0666 \u0644\u0644\u0634\u064a\u062e \u0623\u0633\u0639\u062f \u0647\u0645am.</div>"}};

        function changeLanguage(lang) {
            const contentArea = document.getElementById('main-content');
            const pageTitle = document.getElementById('page-title');
            
            const data = translations[lang] || translations['id'];
            pageTitle.innerText = data.title;
            contentArea.innerHTML = data.body;
            
            document.documentElement.lang = lang;
            if(lang === 'ar') {
                contentArea.style.direction = 'rtl';
                contentArea.style.textAlign = 'right';
            } else {
                contentArea.style.direction = 'ltr';
                contentArea.style.textAlign = 'left';
            }
        }

        // Initial Load
        changeLanguage('id');
    </script>
</body>
</html>

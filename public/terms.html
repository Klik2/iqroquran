<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terms of Service - IQRO Quran Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #fdfdfb; color: #1e293b; }
        .content-card { background: white; border-radius: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .lang-btn { transition: all 0.2s; }
        .lang-btn:hover { background-color: #f1f5f9; }
        .active-lang { border: 2px solid #15803d; background-color: #f0fdf4; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <!-- Header & Lang Selector -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <a href="page.html" class="text-green-700 font-bold flex items-center gap-2 mb-2">
                    <i class="fa-solid fa-arrow-left"></i> Kembali ke Beranda
                </a>
                <h1 id="page-title" class="text-3xl font-black text-slate-900">Terms of Service</h1>
            </div>
            <div class="relative inline-block text-left w-full md:w-auto">
                <select id="langSelect" onchange="changeLanguage(this.value)" class="block w-full bg-white border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
                    <option value="id">🇮🇩 Bahasa Indonesia</option>
                    <option value="en">🇺🇸 English</option>
                    <option value="ar">🇸🇦 العربية</option>
                    <option value="ru">🇷🇺 Русский</option>
                    <option value="zh">🇨🇳 中文</option>
                    <option value="ja">🇯🇵 日本語</option>
                </select>
            </div>
        </div>

        <!-- Main Content -->
        <div class="content-card p-6 md:p-10 border border-gray-100">
            <div id="main-content" class="prose prose-slate max-w-none">
                <!-- Content will be injected here -->
            </div>
        </div>

        <footer class="mt-12 text-center text-sm text-gray-400 font-bold">
            &copy; 2026 IQRO QURAN DIGITAL by Te_eR™ Innovative
        </footer>
    </div>

    <script>
        const translations = {"id": {"title": "Ketentuan Layanan", "body": "<h3>1. Tujuan Aplikasi</h3><p>IQRO Digital adalah aplikasi non-komersial untuk memfasilitasi pembelajaran Al-Qur'an secara gratis.</p>\n                   <h3>2. Hak Cipta</h3><p>Materi Iqro didasarkan pada Metode Iqro (Jilid 1-6) karya K.H. As'ad Humam. Sumber Al-Qur'an dan Murottal berasal dari <strong>Quran Cloud API</strong>.</p>\n                   <h3>3. Adab Belajar</h3><p>Meskipun aplikasi ini lengkap, pendekatan terbaik tetaplah <strong>Tallaqi dan Musyafahah</strong> (belajar langsung dengan guru).</p>"}, "en": {"title": "Terms of Service", "body": "<h3>1. Application Purpose</h3><p>IQRO Digital is a non-commercial app dedicated to facilitating free Quranic learning.</p>\n                   <h3>2. Copyright</h3><p>Iqro materials are based on Method Iqro (Vol 1-6) by K.H. As'ad Humam. Quranic data and Murottal are sourced from <strong>Quran Cloud API</strong>.</p>\n                   <h3>3. Learning Ethics</h3><p>While the app is comprehensive, the best approach remains <strong>Tallaqi and Musyafahah</strong> (direct learning with a teacher).</p>"}, "ar": {"title": "\u0634\u0631\u0648\u0637 \u0627\u0644\u062e\u062f\u0645\u0629", "body": "<h3>\u0661. \u0627\u0644\u063a\u0631\u0636 \u0645\u0646 \u0627\u0644\u062a\u0637\u0628\u064a\u0642</h3><p>\u062a\u0637\u0628\u064a\u0642 \"\u0627\u0642\u0631\u0623 \u062f\u064a\u062c\u064a\u062a\u0627\u0644\" \u0647\u0648 \u062a\u0637\u0628\u064a\u0642 \u063a\u064a\u0631 \u062a\u062c\u0627\u0631\u064a \u0645\u062e\u0635\u0635 \u0644\u062a\u0633\u0647\u064a\u0644 \u062a\u0639\u0644\u0645 \u0627\u0644\u0642\u0631\u0622\u0646 \u0627\u0644\u0643\u0631\u064a\u0645 \u0645\u062c\u0627\u0646\u064b\u0627.</p>\n                   <h3>\u0662. \u062d\u0642\u0648\u0642 \u0627\u0644\u0637\u0628\u0639 \u0648\u0627\u0644\u0646\u0634\u0631</h3><p>\u062a\u0639\u062a\u0645\u062f \u0645\u0648\u0627\u062f \"\u0627\u0642\u0631\u0623\" \u0639\u0644\u0649 \u0645\u0646\u0647\u062c \"\u0627\u0642\u0631\u0623\" (\u0627\u0644\u0645\u062c\u0644\u062f\u0627\u062a \u0661-\u0666) \u0644\u0644\u0634\u064a\u062e \u0623\u0633\u0639\u062f \u0647\u0645\u0627\u0645. \u064a\u062a\u0645 \u0627\u0644\u062d\u0635\u0648\u0644 \u0639\u0644\u0649 \u0628\u064a\u0627\u0646\u0627\u062a \u0627\u0644\u0642\u0631\u0622\u0646 \u0648\u0627\u0644\u0645\u0635\u0627\u062f\u0631 \u0627\u0644\u0635\u0648\u062a\u064a\u0629 \u0645\u0646 <strong>Quran Cloud API</strong>.</p>"}};

        function changeLanguage(lang) {
            const contentArea = document.getElementById('main-content');
            const pageTitle = document.getElementById('page-title');
            
            const data = translations[lang] || translations['id'];
            pageTitle.innerText = data.title;
            contentArea.innerHTML = data.body;
            
            document.documentElement.lang = lang;
            if(lang === 'ar') {
                contentArea.style.direction = 'rtl';
                contentArea.style.textAlign = 'right';
            } else {
                contentArea.style.direction = 'ltr';
                contentArea.style.textAlign = 'left';
            }
        }

        // Initial Load
        changeLanguage('id');
    </script>
</body>
</html>
